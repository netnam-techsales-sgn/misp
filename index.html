<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <!-- Viewport tối ưu cho iPhone tai thỏ/Dynamic Island và Android -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>Enterprise Portal - Authentication</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --sat: env(safe-area-inset-top, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --sal: env(safe-area-inset-left, 0px);
            --sar: env(safe-area-inset-right, 0px);
        }
        body {
            padding-top: var(--sat); padding-bottom: var(--sab);
            padding-left: var(--sal); padding-right: var(--sar);
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-slate-900 font-sans h-[100dvh] flex items-center justify-center px-4 py-6 text-gray-800 antialiased">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-6 sm:p-8 border border-slate-700/50 my-auto">
        <div class="text-center mb-6">
            <div class="w-12 h-12 sm:w-14 sm:h-14 bg-blue-600 rounded-2xl flex items-center justify-center text-white text-2xl mx-auto mb-3 shadow-lg shadow-blue-500/30">
                🏢
            </div>
            <h1 class="text-xl sm:text-2xl font-bold text-gray-900 tracking-tight">ENTERPRISE PORTAL</h1>
            <p class="text-[11px] sm:text-xs text-gray-500 mt-1">Cổng thông tin dự án & Quản trị hạ tầng phân tán</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-[11px] sm:text-xs font-semibold text-gray-700 uppercase mb-1">Tên đăng nhập</label>
                <input type="text" id="login-username" required placeholder="Nhập username..." 
                       class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition">
            </div>
            <div>
                <label class="block text-[11px] sm:text-xs font-semibold text-gray-700 uppercase mb-1">Mật khẩu</label>
                <input type="password" id="login-password" required placeholder="••••••••" 
                       class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition">
            </div>
            <div id="login-error" class="hidden text-xs text-red-600 font-medium bg-red-50 p-2.5 rounded-lg border border-red-200">
                ⚠️ Tên đăng nhập hoặc mật khẩu không chính xác!
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-semibold py-2.5 rounded-xl text-sm shadow-md transition duration-200 min-h-[44px]">
                Đăng nhập hệ thống →
            </button>
        </form>
    </div>

    <script>
        // Danh sách tài khoản mặc định chuẩn của tất cả dự án
        const defaultUsers = [
            { id: 1, name: "Quản Trị Viên Hệ Thống", username: "admin", password: "admin123", role: "ADMIN", tenantId: "all", targetPage: "admin.html" },
            { id: 2, name: "Đại Diện Uniqlo VN", username: "client_uniqlo", password: "123456", role: "CLIENT", tenantId: "uniqlo", targetPage: "uniqlo.html" },
            { id: 3, name: "Đại Diện Starbucks VN", username: "client_starbucks", password: "123456", role: "CLIENT", tenantId: "starbucks", targetPage: "starbucks.html" },
            { id: 4, name: "Đại Diện TCB Ball", username: "client_tcbball", password: "123456", role: "CLIENT", tenantId: "tcbball", targetPage: "tcb_ball.html" },
			{ id: 5, name: "Đại Diện Passio Coffee", username: "client_passio",  password: "123456", role: "CLIENT", tenantId: "passio", targetPage: "passio.html" },
			{ id: 6, name: "Đại Diện Muji", username: "muji",  password: "123456", role: "CLIENT", tenantId: "Muji", targetPage: "muji.html" },
       ];

        // Khởi tạo và tự động đồng bộ tài khoản mới vào localStorage
        try {
            let currentUsers = JSON.parse(localStorage.getItem('portal_usersDB'));
            if (!currentUsers || !Array.isArray(currentUsers)) {
                localStorage.setItem('portal_usersDB', JSON.stringify(defaultUsers));
            } else {
                defaultUsers.forEach(defUser => {
                    const idx = currentUsers.findIndex(u => u.username === defUser.username);
                    if (idx === -1) {
                        currentUsers.push(defUser);
                    } else {
                        currentUsers[idx].targetPage = defUser.targetPage;
                        currentUsers[idx].tenantId = defUser.tenantId;
                    }
                });
                localStorage.setItem('portal_usersDB', JSON.stringify(currentUsers));
            }
        } catch (err) {
            localStorage.setItem('portal_usersDB', JSON.stringify(defaultUsers));
        }

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('login-username').value.trim();
            const p = document.getElementById('login-password').value.trim();
            const errBox = document.getElementById('login-error');

            let usersDB = defaultUsers;
            try {
                const stored = JSON.parse(localStorage.getItem('portal_usersDB'));
                if (stored && Array.isArray(stored)) usersDB = stored;
            } catch (err) {
                usersDB = defaultUsers;
            }

            const user = usersDB.find(x => x.username === u && x.password === p);

            if (user) {
                errBox.classList.add('hidden');
                sessionStorage.setItem('portal_session', JSON.stringify(user));
                
                if (user.role === 'ADMIN') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = user.targetPage || (user.tenantId + '.html');
                }
            } else {
                errBox.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
